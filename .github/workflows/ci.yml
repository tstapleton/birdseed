name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # @tstapleton/plotline comes from GitHub Packages

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@tstapleton'
      - run: npm ci --no-audit --no-fund
      - name: Check the app doesn't use RxJS
        run: |
          if grep -rnE "from ['\"]rxjs" src; then
            echo "::error::Use async/await and signals instead of RxJS."
            exit 1
          fi
      - name: Typecheck the tests
        run: npx tsc -p tsconfig.spec.json --noEmit
      - run: npx jest --ci
      - run: npx ng build
