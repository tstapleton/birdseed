name: Plotline

# Records every integration test as a sequence diagram on the PR and on its base,
# and comments with what changed.
on:
  pull_request:

concurrency:
  group: plotline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # a base commit from before the move to npmjs installs @tstapleton/plotline from GitHub Packages
  pull-requests: write # the behaviour diff comment

jobs:
  behaviour-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read by the .npmrc that setup-node writes, in both checkouts.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@tstapleton'
      - uses: tstapleton/plotline@v0
        with:
          test-command: npx jest --ci
